[project]
name = "pc-maintenance"
version = "0.1.0"
description = "Disk usage analysis and maintenance tools for development machines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mauro Sciancalepore", email = "mauroscianca98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
    "textual>=1.0",
]

[project.scripts]
diskhog = "pc_maintenance.diskhog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.build-backend]
source-include = ["apps/*.py", "tests/**/*.py", "uv.lock"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
